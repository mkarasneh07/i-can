<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I can…</title>
<meta name="theme-color" content="#6A4DF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="I can">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF6FF; --ink:#27253A; --card:#fff; --muted:#7B7892;
  --pink:#FF4F83; --grape:#6A4DF0; --btn:#fff; --btnInk:#27253A;
  --track:rgba(39,37,58,.10); --ring:0 8px 22px rgba(42,34,110,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15142A; --ink:#F4F2FF; --card:#211F3D; --muted:#A7A3C6;
    --btn:#2B2950; --btnInk:#F4F2FF; --track:rgba(255,255,255,.14); --ring:0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15142A; --ink:#F4F2FF; --card:#211F3D; --muted:#A7A3C6;
  --btn:#2B2950; --btnInk:#F4F2FF; --track:rgba(255,255,255,.14); --ring:0 8px 22px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:760px;margin:0 auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}

.top{display:flex;align-items:center;justify-content:center;gap:10px;min-height:26px}
#phase{font-size:14px;font-weight:600;color:var(--muted);min-width:56px;text-align:right}
#dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#dots i{width:11px;height:11px;border-radius:50%;background:var(--track);transition:transform .25s,background .25s}
#dots i.done{background:var(--grape);opacity:.45}
#dots i.cur{background:var(--pink);transform:scale(1.45)}

.stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
#st{width:100%;height:auto;max-height:100%;border-radius:32px;box-shadow:var(--ring);background:var(--card);display:block}
@supports (width:1cqmin){#st{width:100cqmin;height:100cqmin;max-height:none}}

.caption{text-align:center;font-weight:700;font-size:clamp(30px,7.6vw,60px);line-height:1.1;min-height:1.15em}
.caption .v{color:var(--pink)}
.caption .q{color:var(--grape);display:inline-block;animation:qpulse 1.2s ease-in-out infinite}
.caption .pop{display:inline-block;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes qpulse{50%{transform:scale(1.18)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

.turn{height:30px;display:flex;align-items:center;justify-content:center;gap:10px;opacity:0;transition:opacity .25s}
.turn.on{opacity:1}
.turn .mic{font-size:24px;animation:qpulse .9s ease-in-out infinite}
.bar{width:min(300px,58vw);height:12px;border-radius:99px;background:var(--track);overflow:hidden}
#barFill{display:block;height:100%;width:100%;background:var(--grape);border-radius:inherit}

.controls{display:flex;justify-content:center;align-items:center;gap:14px}
.controls button{width:56px;height:56px;border-radius:50%;border:0;background:var(--btn);color:var(--btnInk);box-shadow:var(--ring);display:grid;place-items:center;cursor:pointer}
.controls button svg{width:26px;height:26px;fill:currentColor}
.controls #play{width:70px;height:70px;background:var(--grape);color:#fff}
.controls #play svg{width:32px;height:32px}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

details.settings{font-size:15px;color:var(--muted)}
details.settings summary{cursor:pointer;text-align:center;list-style:none;font-weight:600;padding:4px}
details.settings summary::-webkit-details-marker{display:none}
.srow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:8px 0}
.srow span{min-width:84px;text-align:right}
.chip{border:0;border-radius:99px;padding:7px 14px;background:var(--btn);color:var(--btnInk);font:inherit;font-weight:600;box-shadow:var(--ring);cursor:pointer}
.chip.on{background:var(--grape);color:#fff}
select{font:inherit;border-radius:12px;padding:6px 10px;border:0;background:var(--btn);color:var(--btnInk);box-shadow:var(--ring);max-width:240px}
.tip{text-align:center;font-size:13px;max-width:460px;margin:6px auto 2px;line-height:1.4}

#startOv{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5;padding:20px;text-align:center}
#startOv.hide{display:none}
#startBtn{width:132px;height:132px;border-radius:50%;border:0;background:var(--grape);color:#fff;box-shadow:var(--ring);cursor:pointer;display:grid;place-items:center;animation:qpulse 1.6s ease-in-out infinite}
#startBtn svg{width:58px;height:58px;fill:#fff;margin-left:8px}
#startOv h1{margin:0;font-size:clamp(40px,11vw,72px);color:var(--ink)}
#startOv p{margin:0;color:var(--muted);font-size:17px}

/* ---------- scene rig ---------- */
#st *{transform-box:view-box}
#st .tw{transform-box:fill-box;transform-origin:center}
@keyframes fadeIn{from{opacity:.15}to{opacity:1}}
.limb{transition:transform .35s ease}
#girl{transform-origin:150px 254px;transition:transform .35s ease}
#head{transform-origin:150px 122px}
#legL{transform-origin:142px 196px} #legR{transform-origin:158px 196px}
#armL{transform-origin:125.5px 132px;transform:rotate(8deg)}
#armR{transform-origin:174.5px 132px;transform:rotate(-8deg)}
#foreL{transform-origin:125.5px 156px} #foreR{transform-origin:174.5px 156px}
#shadow{transform-origin:150px 256px}
#eyes{transition:transform .3s}
.p,.m,.bg{display:none}
.m-smile{display:inline}

/* which background for which action */
.a-ask .bg-park,.a-walk .bg-park,.a-run .bg-park,.a-jump .bg-park,.a-dance .bg-park,.a-help .bg-park,.a-end .bg-park,
.a-swim .bg-pool,.a-sing .bg-stage,.a-draw .bg-room,.a-write .bg-room,.a-read .bg-room,.a-brush .bg-bath,.a-wash .bg-bath{display:inline}

@keyframes osc{0%,100%{transform:rotate(var(--a))}50%{transform:rotate(var(--b))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--h,-4px))}}
@keyframes scroll{to{transform:translateX(-300px)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.05,.95)}12%{transform:translateY(0) scale(1)}50%{transform:translateY(-58px)}88%{transform:translateY(0) scale(1)}}
@keyframes shadow{50%{transform:scale(.5);opacity:.4}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes spinR{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
@keyframes wave{to{transform:translateX(-50px)}}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-46px);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes mouth{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.15)}}
@keyframes drawIn{0%{stroke-dashoffset:100;opacity:1}55%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes l1{0%,4%{opacity:0}10%,88%{opacity:1}96%,100%{opacity:0}}
@keyframes l2{0%,30%{opacity:0}36%,88%{opacity:1}96%,100%{opacity:0}}
@keyframes l3{0%,56%{opacity:0}62%,88%{opacity:1}96%,100%{opacity:0}}
@keyframes brushX{0%,100%{transform:translateX(-2px)}50%{transform:translateX(3px)}}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes flip{0%,30%{transform:scaleX(1);opacity:1}62%{transform:scaleX(-1);opacity:1}80%,100%{transform:scaleX(-1);opacity:0}}
@keyframes heart{0%,100%{transform:translateY(0) scale(.9)}50%{transform:translateY(-6px) scale(1.12)}}
@keyframes qfloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-9px) rotate(6deg)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
@keyframes flick{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.cloud{animation:drift 9s ease-in-out infinite}
.cloud2{animation:drift 12s ease-in-out infinite reverse}
.lid{transform-box:fill-box!important;transform-origin:center;animation:blink 4s infinite}
.spotlight{animation:flick 3s ease-in-out infinite;opacity:.6}

/* ask */
.a-ask .p-ask{display:inline}
.a-ask #armR{transform:rotate(-140deg)}
.a-ask #foreR{--a:0deg;--b:-40deg;animation:osc .7s ease-in-out infinite}
.a-ask #head{--a:-5deg;--b:5deg;animation:osc 2s ease-in-out infinite}
.a-ask .qmark{animation:qfloat 2s ease-in-out infinite}

/* walk + help */
.a-walk #legL,.a-help #legL{--a:14deg;--b:-14deg}
.a-walk #legR,.a-help #legR{--a:-14deg;--b:14deg}
.a-walk #armL{--a:2deg;--b:22deg}
.a-walk #armR{--a:-22deg;--b:-2deg}
.a-walk #legL,.a-walk #legR,.a-walk #armL,.a-walk #armR,.a-help #legL,.a-help #legR{animation:osc .8s ease-in-out infinite}
.a-walk #girl,.a-help #girl,.a-help .boxg{animation:bob .4s ease-in-out infinite}
.a-walk #tufts,.a-help #tufts{animation:scroll 5s linear infinite}
.a-walk #trees,.a-help #trees{animation:scroll 14s linear infinite}

/* run */
.a-run .p-run{display:inline}
.a-run #legL{--a:32deg;--b:-32deg} .a-run #legR{--a:-32deg;--b:32deg}
.a-run #armL{--a:-5deg;--b:45deg} .a-run #armR{--a:-45deg;--b:5deg}
.a-run #legL,.a-run #legR,.a-run #armL,.a-run #armR{animation:osc .44s ease-in-out infinite}
.a-run #foreL{transform:rotate(-70deg)} .a-run #foreR{transform:rotate(70deg)}
.a-run #girl{--h:-7px;animation:bob .22s ease-in-out infinite}
.a-run #tufts{animation:scroll 1.3s linear infinite}
.a-run #trees{animation:scroll 4s linear infinite}
.a-run .speed{animation:flick .3s linear infinite}

/* jump */
.a-jump #girl{animation:jump 1.1s ease-in-out infinite}
.a-jump #shadow{animation:shadow 1.1s ease-in-out infinite}
.a-jump #armL{--a:15deg;--b:160deg} .a-jump #armR{--a:-15deg;--b:-160deg}
.a-jump #legL{--a:0deg;--b:16deg} .a-jump #legR{--a:0deg;--b:-16deg}
.a-jump #armL,.a-jump #armR,.a-jump #legL,.a-jump #legR{animation:osc 1.1s ease-in-out infinite}

/* swim */
.a-swim .p-swim{display:inline}
.a-swim #girl{transform:translateY(10px)}
.a-swim #armL{animation:spin 1.5s linear infinite}
.a-swim #armR{animation:spinR 1.5s linear infinite -.75s}
.a-swim #head{--a:-6deg;--b:6deg;animation:osc 1.5s ease-in-out infinite}
.a-swim .waves{animation:wave 1.2s linear infinite}
.a-swim #shadow{display:none}
.a-swim .splash{animation:twinkle .75s ease-in-out infinite}

/* dance */
.a-dance .p-dance{display:inline}
.a-dance #girl{--a:-7deg;--b:7deg;animation:osc 1s ease-in-out infinite}
.a-dance #armL{--a:125deg;--b:165deg} .a-dance #armR{--a:-165deg;--b:-125deg}
.a-dance #foreL{--a:0deg;--b:30deg} .a-dance #foreR{--a:-30deg;--b:0deg}
.a-dance #armL,.a-dance #armR,.a-dance #foreL,.a-dance #foreR{animation:osc .5s ease-in-out infinite}
.a-dance #legL{--a:-8deg;--b:10deg} .a-dance #legR{--a:-10deg;--b:8deg}
.a-dance #legL,.a-dance #legR{animation:osc 1s ease-in-out infinite}
.a-dance .spark{animation:twinkle 1s ease-in-out infinite}

/* sing (holding a microphone) */
.a-sing .p-sing{display:inline}
.a-sing .m-smile{display:none} .a-sing .m-open{display:inline;transform-origin:150px 106px;animation:mouth .45s ease-in-out infinite}
.a-sing #head{--a:-6deg;--b:6deg;animation:osc 1.6s ease-in-out infinite}
.a-sing #armL{--a:40deg;--b:60deg;animation:osc 1.6s ease-in-out infinite} .a-sing #foreL{transform:rotate(35deg)}
.a-sing #armR{transform:rotate(56deg)} .a-sing #foreR{transform:rotate(137deg)}
.a-sing #girl{animation:bob .8s ease-in-out infinite}
.a-sing .note{animation:floatUp 2.4s ease-out infinite}

/* draw + write */
.a-draw .p-draw,.a-write .p-write{display:inline}
.a-draw #girl,.a-write #girl{transform:translateX(-30px)}
.a-draw #armR,.a-write #armR{--a:-80deg;--b:-100deg;animation:osc 1.2s ease-in-out infinite}
.a-draw #foreR,.a-write #foreR{--a:-35deg;--b:-55deg;animation:osc .6s ease-in-out infinite}
.a-draw #eyes,.a-write #eyes{transform:translate(3px,-1px)}
.a-draw .art{animation:drawIn 3.6s ease-in-out infinite}
.a-write .l1{animation:l1 3.6s linear infinite}
.a-write .l2{animation:l2 3.6s linear infinite}
.a-write .l3{animation:l3 3.6s linear infinite}

/* help (carry box) + read (hold book) */
.a-help .p-help,.a-read .p-read{display:inline}
.a-help #armL,.a-read #armL{transform:rotate(64.5deg)} .a-help #foreL,.a-read #foreL{transform:rotate(-107deg)}
.a-help #armR,.a-read #armR{transform:rotate(-64.5deg)} .a-help #foreR,.a-read #foreR{transform:rotate(107deg)}
.a-help .heart{animation:heart 1.6s ease-in-out infinite}
.a-read #eyes{transform:translateY(3px)}
.a-read #head{--a:-3deg;--b:3deg;animation:osc 3s ease-in-out infinite}
.a-read .flip{transform-origin:150px 160px;animation:flip 2.6s ease-in-out infinite}

/* brush */
.a-brush .p-brush{display:inline}
.a-brush .m-smile{display:none} .a-brush .m-grin{display:inline}
.a-brush #armR{--a:-146deg;--b:-154deg;animation:osc .35s ease-in-out infinite}
.a-brush #foreR{transform:rotate(-112deg)}
.a-brush .brushg{animation:brushX .35s ease-in-out infinite}
.a-brush .foam{animation:twinkle .7s ease-in-out infinite}

/* wash */
.a-wash .p-wash{display:inline}
.a-wash #armL,.a-wash #armR{transform:rotate(0deg)}
.a-wash #foreL{--a:-44deg;--b:-54deg} .a-wash #foreR{--a:54deg;--b:44deg}
.a-wash #foreL,.a-wash #foreR{animation:osc .5s ease-in-out infinite}
.a-wash #eyes{transform:translateY(3px)}
.a-wash .flowl{animation:flow .5s linear infinite}
.a-wash .bub{animation:floatUp 1.6s ease-out infinite}

/* end */
.a-end .p-end{display:inline}
.a-end #armL{transform:rotate(155deg)} .a-end #armR{transform:rotate(-155deg)}
.a-end #girl{--h:-10px;animation:bob .9s ease-in-out infinite}
.a-end .star{animation:twinkle 1.2s ease-in-out infinite}

.d1{animation-delay:-.4s!important}.d2{animation-delay:-.8s!important}.d3{animation-delay:-1.2s!important}.d4{animation-delay:-1.6s!important}
@media (prefers-reduced-motion: reduce){.cloud,.cloud2,.spotlight{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><span id="phase"></span><div id="dots" aria-hidden="true"></div></header>

  <main class="stageWrap">
    <svg id="st" viewBox="0 0 300 300" role="img" aria-label="A little girl showing each action">
      <defs>
        <radialGradient id="gSkin" cx=".42" cy=".38" r=".75"><stop offset="0" stop-color="#FFDDC6"/><stop offset="1" stop-color="#EAAE88"/></radialGradient>
        <linearGradient id="gLimb" x1="0" x2="1"><stop offset="0" stop-color="#F9CDAE"/><stop offset=".6" stop-color="#F1BC98"/><stop offset="1" stop-color="#E2A47E"/></linearGradient>
        <linearGradient id="gHair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C4C31"/><stop offset="1" stop-color="#3D2417"/></linearGradient>
        <linearGradient id="gDress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8DB0"/><stop offset="1" stop-color="#E03E74"/></linearGradient>
        <linearGradient id="gDressSide" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".12"/><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".14"/></linearGradient>
        <linearGradient id="gShoe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C63FF"/><stop offset="1" stop-color="#4A2FCB"/></linearGradient>
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CC8FF"/><stop offset="1" stop-color="#E3F5FF"/></linearGradient>
        <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9EDC80"/><stop offset="1" stop-color="#63B04D"/></linearGradient>
        <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6AD4F7"/><stop offset="1" stop-color="#1B7FC0"/></linearGradient>
        <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF5E8"/><stop offset="1" stop-color="#F6DDBE"/></linearGradient>
        <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9A56E"/><stop offset="1" stop-color="#B37844"/></linearGradient>
        <linearGradient id="gCurtain" x1="0" x2="1"><stop offset="0" stop-color="#9E1238"/><stop offset=".5" stop-color="#D9315C"/><stop offset="1" stop-color="#9E1238"/></linearGradient>
        <linearGradient id="gSpot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6CF" stop-opacity=".9"/><stop offset="1" stop-color="#FFF6CF" stop-opacity=".05"/></linearGradient>
        <linearGradient id="gChrome" x1="0" x2="1"><stop offset="0" stop-color="#CFD8DC"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#90A4AE"/></linearGradient>
        <radialGradient id="gSunGlow"><stop offset="0" stop-color="#FFE9A0" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/></radialGradient>
        <pattern id="pTiles" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#E4F4FA"/><path d="M20,0 V20 M0,20 H20" stroke="#BFDFEB" stroke-width="1.6"/></pattern>
        <pattern id="pFloor" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#BFDCE7"/><path d="M24,0 V24 M0,24 H24" stroke="#9EC6D4" stroke-width="1.5"/></pattern>
        <pattern id="pPool" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16,0 V16 M0,16 H16" stroke="#fff" stroke-width="1" opacity=".35"/></pattern>
        <pattern id="pPlanks" width="60" height="16" patternUnits="userSpaceOnUse"><path d="M0,16 H60 M30,0 V16" stroke="#9C6536" stroke-width="1.2" opacity=".6"/></pattern>
        <filter id="fSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
        <clipPath id="frame"><rect width="300" height="300" rx="32"/></clipPath>
      </defs>
      <g clip-path="url(#frame)"><g id="scene">

      <!-- ===== backgrounds ===== -->
      <g class="bg bg-park">
        <rect width="300" height="300" fill="url(#gSky)"/>
        <circle cx="256" cy="44" r="34" fill="url(#gSunGlow)"/><circle cx="256" cy="44" r="16" fill="#FFCB3D"/>
        <g class="cloud" fill="#fff" opacity=".95"><ellipse cx="56" cy="48" rx="24" ry="11"/><ellipse cx="72" cy="41" rx="15" ry="12"/><ellipse cx="44" cy="42" rx="11" ry="9"/></g>
        <g class="cloud2" fill="#fff" opacity=".8"><ellipse cx="180" cy="30" rx="18" ry="8"/><ellipse cx="192" cy="25" rx="11" ry="9"/></g>
        <path d="M0,196 Q60,160 120,190 T240,182 T300,176 V250 H0Z" fill="#B3E09A"/>
        <path d="M0,212 Q80,186 160,208 T300,202 V250 H0Z" fill="#94D07A"/>
        <g id="trees"></g>
        <rect y="236" width="300" height="64" fill="url(#gGrass)"/>
        <path d="M0,258 Q150,249 300,258 V300 H0Z" fill="#E7D2A6"/>
        <path d="M0,258 Q150,249 300,258" stroke="#D4BA88" stroke-width="2" fill="none"/>
        <g id="tufts"></g>
      </g>

      <g class="bg bg-pool">
        <rect width="300" height="300" fill="url(#gSky)"/>
        <g class="cloud" fill="#fff" opacity=".9"><ellipse cx="70" cy="40" rx="22" ry="10"/><ellipse cx="86" cy="34" rx="14" ry="11"/></g>

    <div class="srow"><span>Her turn</span><button class="chip" data-pause="3000">3 sec</button><button class="chip" data-pause="5000">5 sec</button><button class="chip" data-pause="8000">8 sec</button></div>
    <div class="srow"><span>Voice speed</span><button class="chip" data-rate="0.8">Slow</button><button class="chip" data-rate="0.95">Normal</button></div>
    <div class="srow"><span>Voice</span><select id="voiceSel"></select><button class="chip" id="testVoice">Test</button></div>
    <div class="srow"><button class="chip" id="toReview">Go to review</button><button class="chip" id="toStart">Start over</button></div>
    <p class="tip">Nicer voice on iPhone: Settings → Accessibility → Spoken Content → Voices → English, download a "Premium" or "Enhanced" voice (Ava, Zoe or Samantha), then choose it above.</p>
  </details>
</div>

<div id="startOv">
  <h1>I can…</h1>
  <button id="startBtn" aria-label="Start"><svg viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg></button>
  <p>Turn the sound on</p>
</div>

<script>
(function(){
  const tufts=document.getElementById('tufts'), trees=document.getElementById('trees');
  const cols=['#FF4F83','#FFC93C','#fff','#6A4DF0'];
  let h='';
  for(let i=0;i<8;i++){
    const x=i*75+18;
    h+=`<g transform="translate(${x},0)"><path d="M0,252 Q-3,246 -7,242 M0,252 Q1,245 2,239 M0,252 Q4,247 9,244" stroke="#3E8A35" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
    if(i%2===0){const c=cols[(i/2)%4];h+=`<path d="M22,252 L22,236" stroke="#3E8A35" stroke-width="2"/><g fill="${c}"><circle cx="18" cy="232" r="4"/><circle cx="26" cy="232" r="4"/><circle cx="22" cy="228" r="4"/><circle cx="22" cy="236" r="4"/></g><circle cx="22" cy="232" r="2.6" fill="#FFB300"/>`}
    h+='</g>';
  }
  tufts.innerHTML=h;
  let t='';
  for(const x of [30,135,230,330,435,530]){
    t+=`<g><rect x="${x-4}" y="176" width="8" height="48" rx="3" fill="#8B5A3C"/><circle cx="${x}" cy="160" r="24" fill="#4E9E43"/><circle cx="${x-15}" cy="174" r="16" fill="#4E9E43"/><circle cx="${x+15}" cy="174" r="16" fill="#4E9E43"/><circle cx="${x-6}" cy="152" r="12" fill="#6CC05A"/><circle cx="${x+10}" cy="166" r="8" fill="#6CC05A"/></g>`;
  }
  trees.innerHTML=t;
  let w='M0,160 q12.5,-7 25,0'; for(let i=0;i<23;i++) w+=' t25,0';
  document.getElementById('wavePath').setAttribute('d',w);
  let r='<path d="M0,214 H300" stroke="#fff" stroke-width="1.5" opacity=".6"/>';
  for(let x=6;x<300;x+=12) r+=`<circle cx="${x}" cy="214" r="5" fill="${(x/12|0)%2?'#fff':'#FF5252'}"/>`;
  document.getElementById('rope').innerHTML=r;
})();

const P=[["walk","I can walk!"],["run","I can run!"],["jump","I can jump!"],["swim","I can swim!"],["dance","I can dance!"],["sing","I can sing!"],["draw","I can draw!"],["write","I can write!"],["help","I can help!"],["brush","I can brush my teeth!"],["wash","I can wash my hands!"],["read","I can read!"]];
const Q="What can you do?";
const T=[{k:'ask',act:'ask',text:Q}]
  .concat(P.map(([a,t],i)=>({k:'learn',act:a,text:t,i})))
  .concat([{k:'ask',act:'ask',text:Q,rev:true}])
  .concat(P.map(([a,t],i)=>({k:'review',act:a,text:t,i})))
  .concat([{k:'end',act:'end'}]);
const REVIEW=P.length+1;

const $=id=>document.getElementById(id);
const st=$('st'),scene=$('scene'),cap=$('cap'),turnEl=$('turn'),fill=$('barFill'),dots=$('dots'),phase=$('phase');
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let idx=0,playing=false,token=0,voice=null,lastAct='';
let pauseMs=5000,rate=0.8,voiceName='';

try{const s=JSON.parse(localStorage.getItem('ican-settings-v2')||'{}');if(s.pauseMs)pauseMs=s.pauseMs;if(s.rate)rate=s.rate;if(s.voice)voiceName=s.voice;}catch(e){}
function save(){try{localStorage.setItem('ican-settings-v2',JSON.stringify({pauseMs,rate,voice:voiceName}))}catch(e){}}

P.forEach(()=>dots.appendChild(document.createElement('i')));

function capHTML(t){
  const m=t.match(/^I can (.+)!$/);
  return m?`<span class="pop">I can <span class="v">${m[1]}</span>!</span>`:`<span class="pop">${t}</span>`;
}
function render(s,reveal){
  st.setAttribute('class','a-'+s.act);
  if(s.act!==lastAct){scene.style.animation='none';void scene.getBoundingClientRect();scene.style.animation='fadeIn .45s ease';lastAct=s.act;}
  if(s.k==='end') cap.innerHTML='';
  else if(s.k==='review'&&!reveal) cap.innerHTML='<span class="q">?</span>';
  else cap.innerHTML=capHTML(s.text);
  phase.textContent=s.k==='end'?'':(idx>=REVIEW?'Review':'Learn');
  const cur=s.i===undefined?-1:s.i;
  [...dots.children].forEach((d,i)=>{d.className=s.k==='end'?'done':(i===cur?'cur':(cur>=0&&i<cur?'done':''))});
}

/* choose the most natural-sounding English voice on this device */
function score(v){
  let s=0;const n=v.name;
  if(/natural|neural|premium|enhanced|online/i.test(n))s+=60;
  if(/google us english/i.test(n))s+=40;
  if(/ava|zoe|samantha|aria|jenny|emma|allison|susan|karen|moira|tessa|serena|libby|sonia|michelle|joanna|salli|kendra|ivy|nicky|google uk english female/i.test(n))s+=25;
  if(/en[-_]US/i.test(v.lang))s+=10;
  if(/compact|eloquence|albert|bad news|bahh|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|good news|junior|ralph|fred|kathy|grandpa|grandma|rocko|shelley|flo|eddy|reed|sandy/i.test(n))s-=80;
  if(/daniel|alex|aaron|arthur|gordon|guy|ryan|david|mark|george|rishi|tom|oliver|james|male/i.test(n))s-=20;
  if(v.localService===false)s+=5;
  return s;
}
function pickVoice(){
  if(!synth) return;
  const vs=synth.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang)).sort((a,b)=>score(b)-score(a));
  const sel=$('voiceSel');
  sel.innerHTML=vs.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}">${v.name}</option>`).join('')||'<option>Default English</option>';
  voice=vs.find(v=>v.name===voiceName)||vs[0]||null;
  if(voice) sel.value=voice.name;
}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice;}
$('voiceSel').addEventListener('change',e=>{voiceName=e.target.value;pickVoice();save();speak('I can jump!')});
$('testVoice').onclick=()=>speak('I can jump!');

function speak(text){
  return new Promise(res=>{
    if(!synth){setTimeout(res,1400);return}
    synth.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='en-US';
    u.rate=rate;u.pitch=1.3;u.volume=1;
    let done=false;const fin=()=>{if(!done){done=true;clearTimeout(to);res()}};
    u.onend=fin;u.onerror=fin;
    const to=setTimeout(fin,1800+text.length*140/rate);
    synth.speak(u);
  });
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const CANCEL={};
const ck=my=>{if(my!==token)throw CANCEL};

function showTurn(){
  turnEl.classList.add('on');
  fill.style.transition='none';fill.style.width='100%';void fill.offsetWidth;
  fill.style.transition=`width ${pauseMs}ms linear`;fill.style.width='0%';
}
function hideTurn(){turnEl.classList.remove('on');fill.style.transition='none';fill.style.width='100%';}

async function step(s,my){
  render(s,false);
  if(s.k==='ask'){await speak(s.text);ck(my);await sleep(900);ck(my);return}
  if(s.k==='learn'){await sleep(500);ck(my);await speak(s.text);ck(my);showTurn();await sleep(pauseMs);ck(my);hideTurn();await sleep(250);ck(my);return}
  if(s.k==='review'){await sleep(400);ck(my);showTurn();await sleep(pauseMs);ck(my);hideTurn();render(s,true);await speak(s.text);ck(my);await sleep(1100);ck(my);}
}
async function run(){
  const my=++token;
  try{
    while(true){
      const s=T[idx];
      if(s.k==='end'){render(s,true);playing=false;setPlayBtn();return}
      await step(s,my);ck(my);idx++;
    }
  }catch(e){if(e!==CANCEL)console.error(e)}
}
function stopAll(){token++;if(synth)synth.cancel();hideTurn();}
function setPlayBtn(){
  $('playIcon').innerHTML=playing?'<path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/>':'<path d="M7 4.5v15L19.5 12z"/>';
  $('play').setAttribute('aria-label',playing?'Pause':'Play');
}
function go(i){
  stopAll();idx=Math.max(0,Math.min(T.length-1,i));
  if(playing) run(); else render(T[idx],true);
}
function play(){if(T[idx].k==='end') idx=0;playing=true;setPlayBtn();run();}
$('play').onclick=()=>{if(playing){playing=false;stopAll();setPlayBtn();render(T[idx],true)}else play()};
$('next').onclick=()=>go(idx+1);
$('prev').onclick=()=>go(idx-1);
$('again').onclick=()=>{stopAll();if(T[idx].k==='end')idx=0;playing=true;setPlayBtn();run()};
$('toReview').onclick=()=>{stopAll();idx=REVIEW;playing=true;setPlayBtn();run()};
$('toStart').onclick=()=>{stopAll();idx=0;playing=true;setPlayBtn();run()};

function markChips(){
  document.querySelectorAll('[data-pause]').forEach(b=>b.classList.toggle('on',+b.dataset.pause===pauseMs));
  document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('on',+b.dataset.rate===rate));
}
document.querySelectorAll('[data-pause]').forEach(b=>b.onclick=()=>{pauseMs=+b.dataset.pause;markChips();save()});
document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{rate=+b.dataset.rate;markChips();save()});
markChips();

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();$('play').click()}
  else if(e.code==='ArrowRight')$('next').click();
  else if(e.code==='ArrowLeft')$('prev').click();
});

render(T[0],true);
$('startBtn').onclick=()=>{
  if(synth){const u=new SpeechSynthesisUtterance(' ');u.volume=0;synth.speak(u)}
  $('startOv').classList.add('hide');
  play();
};
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
